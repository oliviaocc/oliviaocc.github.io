<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBeats</title>
    <!-- add the font family of your choice -->
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">     
    <!-- for font style -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <h1> study & relaxation tracker </h1>
    </header>

    <!-- Navigation Section -->
    <nav>
      <ul>
        <li><a href="#">timer</a></li>
        <li><a href="#">music</a></li>
        <li><a href="#">sessions</a></li>
        <!-- Add or remove navigation items as needed -->
      </ul>
    </nav>

    <!-- Main Content Section -->
    <main class="container">
      <!-- Media Player Section -->
      <div class="media-player">
        <video id="custom-video-player" controls>
          <source
            src="https://thelongesthumstore.sgp1.cdn.digitaloceanspaces.com/IM-2250/erokia_ambient-wave-56-msfxp7-78.mp3"
            type="audio/mp3"
          />
        </video>

        

        <div class="custom-controls">
          <button id="play-pause-btn" onclick="togglePlayPause()">
            <img
              id="play-pause-img"
              src="https://img.icons8.com/ios-glyphs/30/play--v1.png"
              alt="Play Button"
            />
          </button>


          <button id="fast-forward-button">
          <img
            src="https://img.icons8.com/ios-glyphs/30/fast-forward.png"
            alt=""
            id="fast-forward-img"
          />

          <button id="mute-unmute-button">
            <img
            id="mute-unmute-img"
            src="https://img.icons8.com/ios-glyphs/30/no-audio--v1.png"
            alt=""
           />
          </button>

           <button id="replay-button">
            <img
            id="replay-img"
            src="https://img.icons8.com/?size=100&id=91644&format=png&color=000000"
            width="35px"
            height=""
           />
          </button>

          <div class="progress-bar">
            <span id="progress-bar-fill"></span>
          </div>
        </div>
      </div>

     


      <!-- Additional Content Section -->
      <section>
        <p>This is where you can showcase any other relevant content.</p>
        <!-- Add more content as needed -->
      </section>

    
    </main>

    <!-- Footer Section -->
    <footer>
      <p>&copy; Study Tracker Website. All rights reserved.</p>
    </footer>
  </body>
</html>
