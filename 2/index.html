<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBeats</title>
    <!-- add the font family of your choice -->
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">     
    <!-- for font style -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <h1> study & relaxation tracker </h1>
    </header>

    <!-- Navigation Section -->



    
    <nav>
      <ul>
        <li> <button id="start-timer-btn">Timer</button> </li>
        <li> <button id="start-music-list">Music</button></li>
       
        <!-- Add or remove navigation items as needed -->
      </ul>
    </nav>


  

    

<div id="timer-container">
  <div class="clock-circle">
    <span id="timer-display">01:00</span>
  </div>

  <button id="start-btn">Start</button>
</div>
 

<!-- Through my process I had to go back and forth between html, css and javascript, as user functions would not work unless all three were linked - for example the functions such as the volume bar and the timer button would not function correctly unless the ‘display’ and ‘width’ in css were adjusted correctly. -->
<!-- The interactive functions I chose to feature in my website were modes I felt were relevant to the study/relaxation context - through including a timer function that allows the user to keep track of their studying periods. -->


    <!-- Main Content Section -->
    <main class="container">



      <!-- Media Player Section -->
      <div class="media-player">
          
        <audio id="custom-video-player" controls>
          <source
            src="https://thelongesthumstore.sgp1.cdn.digitaloceanspaces.com/IM-2250/erokia_ambient-wave-56-msfxp7-78.mp3"
            type="audio/mp3"
          />
        </audio>


  <div id="music-container">

  <nav> 
    <ul id="playlist">
    <li>
      <button class="song-btn" data-song="https://thelongesthumstore.sgp1.cdn.digitaloceanspaces.com/IM-2250/erokia_ambient-wave-56-msfxp7-78.mp3">
        Study Mix 1
      </button>
    </li>

    <li>
      <button class="song-btn" data-song="https://thelongesthumstore.sgp1.cdn.digitaloceanspaces.com/IM-2250/erokia_ambient-wave-56-msfxp7-78.mp3">
        Study Mix 2
      </button>
    </li>

    <li>
      <button class="song-btn" data-song="https://thelongesthumstore.sgp1.cdn.digitaloceanspaces.com/IM-2250/erokia_ambient-wave-56-msfxp7-78.mp3">
        Study Mix 3
      </button>
    </li>
  </ul>
</nav>
 
</div> 

        

        <div class="custom-controls">
          <button id="play-pause-btn" onclick="togglePlayPause()">
            <img
              id="play-pause-img"
              src="https://img.icons8.com/ios-glyphs/30/play--v1.png"
              alt="Play Button"
            />
          </button>


          <!-- I decided to begin with adding the simple user functions (fast forward, pause etc) to demonstrate what my layout would potentially look like alongside all the icons added together. -->


          <button id="fast-forward-button">
          <img
            src="https://img.icons8.com/ios-glyphs/30/fast-forward.png"
            alt=""
            id="fast-forward-img"
          />

          <button id="mute-unmute-button">
            <img
            id="mute-unmute-img"
            src="https://img.icons8.com/ios-glyphs/30/no-audio--v1.png"
            alt=""
           />
          </button>

           <button id="replay-button">
            <img
            id="replay-img"
            src="https://img.icons8.com/?size=100&id=91644&format=png&color=000000"
            width="30px"
            height=""
           />
          </button>

      <div class="volume-control">        
        
       <img src="https://img.icons8.com/ios-glyphs/30/high-volume.png"
                  alt="High Volume"
                  width="20" />


       <input
            type="range"
            id="volume-slider"
            min="0"
            max="1"
            step="0.1"
            value="1"/>

      </div>



          <div class="progress-bar">
            <span id="progress-bar-fill"></span>
            
          </div>
        </div>
      </div>

     


    <!-- Footer Section -->
